<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Sign In — Mentora Labs</title><link rel="icon" href="{{ url_for('static',filename='img/favicon.png') }}"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 12% 15%,#e8f7ff 0,transparent 32%),radial-gradient(circle at 90% 90%,#f3eaff 0,transparent 30%),#f8faff;font-family:Inter,system-ui,sans-serif;color:#172033}.login{width:min(100%,430px);background:#fff;border:1px solid #e8edf4;border-radius:22px;padding:38px;box-shadow:0 24px 70px #20385812}.brand{display:flex;align-items:center;gap:12px;margin-bottom:34px;font-weight:800;font-size:18px}.brand img{width:46px;height:46px;object-fit:contain}.brand small{display:block;color:#8590a2;font-size:10px;letter-spacing:.13em;margin-top:4px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;color:#2FA8E0;text-transform:uppercase}h1{font-size:27px;letter-spacing:-.04em;margin:9px 0 8px}.sub{font-size:13px;color:#7c8799;line-height:1.6;margin:0 0 27px}label{display:block;font-size:12px;font-weight:700;margin:17px 0 8px}input{width:100%;height:48px;border:1px solid #dfe6ef;border-radius:10px;padding:0 13px;font:inherit;font-size:14px;outline:none}input:focus{border-color:#2FA8E0;box-shadow:0 0 0 3px #2FA8E01c}.password-wrap{position:relative}.password-wrap input{padding-right:70px}.toggle{position:absolute;right:10px;top:0;height:48px;border:0;background:none;color:#657188;font-size:11px;font-weight:700;cursor:pointer}.submit{margin-top:25px;width:100%;height:49px;border:0;border-radius:10px;background:linear-gradient(100deg,#2FA8E0,#9B30FF);color:#fff;font-size:14px;font-weight:800;cursor:pointer}.submit:disabled{opacity:.65;cursor:wait}.error{padding:11px 12px;background:#fff1f1;color:#b42318;border:1px solid #ffd8d6;border-radius:9px;font-size:12px;line-height:1.5;margin:18px 0 4px}.foot{text-align:center;color:#a0a9b8;font-size:11px;margin-top:25px}@media(max-width:440px){.login{padding:28px 22px;border-radius:17px}}</style></head><body><section class="login"><div class="brand"><img src="{{ url_for('static',filename='img/logo-96.png') }}" alt="Mentora Labs"><span>Mentora Labs<small>SECURE ADMIN PORTAL</small></span></div><div class="eyebrow">Welcome back</div><h1>Admin sign in</h1><p class="sub">Sign in with your administrator credentials to continue.</p>
{% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}
<form method="post" action="{{ url_for('admin_entry') }}" id="loginForm"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label for="username">Username / Email</label><input id="username" name="username" type="text" autocomplete="username" required maxlength="254" autofocus><label for="password">Password</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button class="toggle" type="button" id="togglePassword" aria-label="Show password" aria-pressed="false">Show</button></div><button class="submit" id="submitButton" type="submit">Sign in</button></form><div class="foot">© Mentora Labs · Authorized access only</div></section>
<script>const p=document.getElementById('password'),t=document.getElementById('togglePassword'),f=document.getElementById('loginForm'),b=document.getElementById('submitButton');t.addEventListener('click',()=>{const show=p.type==='password';p.type=show?'text':'password';t.textContent=show?'Hide':'Show';t.setAttribute('aria-pressed',String(show));t.setAttribute('aria-label',show?'Hide password':'Show password')});f.addEventListener('submit',()=>{b.disabled=true;b.textContent='Signing in…'});</script></body></html>
