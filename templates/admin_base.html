<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Admin Portal — Mentora Labs{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='img/favicon.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--blue:#2FA8E0;--purple:#9B30FF;--ink:#172033;--muted:#748096;--line:#e8edf4;--bg:#f5f7fb}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
.admin-shell{min-height:100vh;display:flex}.sidebar{width:252px;background:#fff;border-right:1px solid var(--line);padding:25px 17px;display:flex;flex-direction:column;flex-shrink:0}
.brand{display:flex;align-items:center;gap:11px;padding:0 9px 28px;text-decoration:none;color:var(--ink);font-weight:800}.brand img{width:42px;height:42px;object-fit:contain}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:3px}
.nav-label{font-size:10px;font-weight:700;letter-spacing:.12em;color:#a0a9b8;padding:12px 12px 8px;text-transform:uppercase}
nav a{display:flex;align-items:center;gap:12px;padding:12px;border-radius:10px;text-decoration:none;color:#5c667a;font-size:13px;font-weight:600;margin:3px 0}
nav a:hover,nav a.active{background:#eef8fd;color:#147fb5}nav a.active{box-shadow:inset 3px 0 var(--blue)}
.sidebar-bottom{margin-top:auto;border-top:1px solid var(--line);padding:18px 8px 0}.user-label{font-size:12px;color:var(--muted);margin-bottom:12px}
.logout{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px;color:#536075;font-weight:600;cursor:pointer}
main{flex:1;min-width:0;padding:38px 42px}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:30px}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.12em}h1{font-size:27px;letter-spacing:-.04em;margin:7px 0 0}.content-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 8px 30px #25385808}.muted{color:var(--muted);line-height:1.7;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#8993a5}td{color:#465166}
.mobile-head{display:none}
@media(max-width:760px){.admin-shell{display:block}.sidebar{width:100%;padding:12px 16px;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:0 4px 12px}.sidebar nav{display:flex;overflow-x:auto;gap:4px}.nav-label{display:none}nav a{white-space:nowrap;padding:10px}.sidebar-bottom{display:flex;align-items:center;justify-content:space-between;padding:12px 4px 0}.user-label{margin:0}.logout{width:auto;padding:9px 13px}main{padding:25px 16px}.content-card{padding:18px;overflow-x:auto}h1{font-size:23px}}
.stats-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:22px}.stat-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px;min-width:0}.stat-card span,.stat-card small{display:block;color:var(--muted);font-size:12px}.stat-card strong{display:block;font-size:29px;letter-spacing:-.04em;margin:12px 0 4px}.dashboard-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}.section-head h2{font-size:16px;margin:0}.section-head a,.text-link{color:#1688c0;font-size:13px;text-decoration:none;font-weight:600}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;color:#344057;border-radius:9px;padding:10px 14px;text-decoration:none;font:600 13px Inter, sans-serif;cursor:pointer}.btn.primary{background:linear-gradient(110deg,var(--blue),var(--purple));border:0;color:white}.btn.small{padding:7px 10px;font-size:11px}.btn.danger{color:#b42318;border-color:#f2d0cd}.topline .muted{margin:8px 0 0}.filters{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}.filters input{flex:1;min-width:190px}.filters input,.filters select,.project-form input:not([type=checkbox]):not([type=file]),.project-form textarea,.project-form select,.status-form textarea,.status-form select{width:100%;border:1px solid #dfe5ee;border-radius:8px;padding:10px 11px;font:13px Inter,sans-serif;color:var(--ink);background:#fff}.filters select{width:auto;min-width:150px}.table-wrap{overflow-x:auto}.project-cell{display:flex;align-items:center;gap:10px;min-width:180px}.project-cell img,.thumb-empty{width:44px;height:36px;object-fit:cover;border-radius:7px;background:#f0f3f8;display:grid;place-items:center}.project-cell strong,.project-cell small,td small{display:block}.project-cell small,td small{font-size:11px;color:var(--muted);margin-top:3px}.pill,.status{display:inline-block;border-radius:30px;padding:5px 9px;font-size:10px;font-weight:700;background:#f1f4f8;color:#657187}.pill.published{background:#e8f8f0;color:#18794e}.pill.draft{background:#fff4e5;color:#9a5b00}.actions{display:flex;gap:6px;align-items:center}.actions form{margin:0}.empty{text-align:center;padding:28px;color:var(--muted)}.pagination{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:var(--muted);font-size:12px}.pagination a{margin-left:12px;color:#1688c0;text-decoration:none}.alert{padding:12px 15px;border-radius:9px;margin-bottom:15px;font-size:13px}.alert.success{background:#eaf8f0;color:#176b43}.alert.error{background:#fff0ef;color:#a12b22}.project-form{max-width:1000px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.form-grid>label,.status-form>label{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700;color:#3c4659}.form-grid .wide,.checks{grid-column:1/-1}.hint{font-size:11px;color:var(--muted);font-weight:400}.field-error{color:#b42318;font-size:11px}.form-actions{display:flex;gap:14px;align-items:center;border-top:1px solid var(--line);padding-top:20px;margin-top:22px}.image-preview{margin-top:10px}.image-preview img{display:block;max-width:180px;max-height:120px;object-fit:contain;border-radius:8px;margin-bottom:8px}.inline-check{display:flex;align-items:center;gap:8px;font-weight:500!important}.checks{display:flex;gap:25px;flex-wrap:wrap}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}.detail-grid>div{min-width:0}.detail-grid small{display:block;color:var(--muted);font-size:11px;margin-bottom:6px}.detail-grid strong{font-size:14px;overflow-wrap:anywhere}.detail-grid p{margin:0;color:#465166;line-height:1.7}.detail-grid .wide{grid-column:1/-1}.preserve{white-space:pre-wrap}.status-form{margin-top:18px;max-width:760px;display:grid;gap:13px}.status-form h2{font-size:17px;margin:0}.status-form .btn{justify-self:start}
@media(max-width:1050px){.stats-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.dashboard-grid{grid-template-columns:1fr}}
@media(max-width:760px){.stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.stat-card{padding:14px}.stat-card strong{font-size:24px}.form-grid,.detail-grid{grid-template-columns:1fr}.form-grid .wide,.checks,.detail-grid .wide{grid-column:auto}.topline{align-items:flex-start;gap:12px}.topline>.btn{white-space:nowrap}.pagination{gap:12px}.actions{flex-wrap:wrap}}
</style>{% block head %}{% endblock %}</head><body>
<div class="admin-shell"><aside class="sidebar">
<a class="brand" href="{{ url_for('admin_dashboard') }}"><img src="{{ url_for('static', filename='img/logo-96.png') }}" alt="Mentora Labs"><span>Mentora Labs<small>ADMIN PORTAL</small></span></a>
<div class="nav-label">Workspace</div><nav aria-label="Admin navigation">
<a href="{{ url_for('admin_dashboard') }}" class="{% if active=='dashboard' %}active{% endif %}">▦ <span>Dashboard</span></a>
<a href="{{ url_for('admin_projects_placeholder') }}" class="{% if active=='projects' %}active{% endif %}">◇ <span>Projects</span></a>
<a href="{{ url_for('admin_orders') }}" class="{% if active=='orders' %}active{% endif %}">▤ <span>Student orders</span></a>
<a href="{{ url_for('admin_enquiries') }}" class="{% if active=='enquiries' %}active{% endif %}">✉ <span>Business enquiries</span></a>
</nav><div class="sidebar-bottom"><div class="user-label">Signed in as <strong>{{ session.get('admin_username','Admin')|e }}</strong></div>
<form method="post" action="{{ url_for('admin_logout') }}"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="logout" type="submit">↪ &nbsp;Log out</button></form></div>
</aside><main>{% block content %}{% endblock %}</main></div></body></html>
